<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Matty and Rory Activity Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EE; --card:#FFFFFF; --ink:#2D2A32; --muted:#6B6570;
    --accent:#F2A541; --accent2:#6CA6C1; --line:#E8DFD2; --good:#4E9F6B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  header{padding:14px 16px 6px;text-align:center}
  h1{margin:0;font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .sub{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:15px}
  nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 16px}
  nav button{font:800 17px 'Nunito',sans-serif;border:3px solid var(--line);background:var(--card);color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer;position:relative}
  nav button.on{border-color:var(--accent);background:#FFF1DC}
  nav .badge{position:absolute;top:-10px;right:-8px;font-size:20px;display:none}
  nav .badge.show{display:block}
  main{max-width:1100px;margin:0 auto;padding:0 16px 30px}
  .panel{display:none}
  .panel.on{display:block}
  [hidden]{display:none !important}
  #c-color{width:auto;max-width:100%;max-height:calc(100vh - 50px);margin:0 auto}
  .work{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
  .stage{background:var(--card);border-radius:22px;box-shadow:0 4px 18px rgba(80,60,30,.10);padding:12px;flex:1 1 520px;max-width:700px;min-width:0}
  canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:12px}
  .tools{background:var(--card);border-radius:22px;box-shadow:0 4px 18px rgba(80,60,30,.10);padding:14px;flex:0 1 310px;min-width:270px}
  .tools h3{margin:4px 0 8px;font-size:15px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:12px}
  .sw{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0;position:relative}
  .sw.on{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08);z-index:1}
  .sw.mix{background:conic-gradient(#E53935,#FDD835,#66BB6A,#4FC3F7,#8E5CC8,#F48FB1,#E53935)}
  .sw.mix input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .btn{font:800 16px 'Nunito',sans-serif;border:3px solid var(--line);background:#fff;color:var(--ink);padding:10px 12px;border-radius:14px;cursor:pointer;flex:1;white-space:nowrap}
  .btn.on{border-color:var(--accent2);background:#E7F2F7}
  .btn.big{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.sm{flex:0 0 auto;padding:8px 12px;font-size:15px}
  .msg{min-height:52px;margin-top:6px;padding:10px 12px;border-radius:14px;background:#F4EFE7;font-weight:700;font-size:17px;text-align:center}
  .msg.good{background:#E3F3E8;color:#245c38}
  /* gallery */
  .gal-head{text-align:center;font-weight:800;color:var(--muted);margin:4px 0 14px;font-size:17px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .tile{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:8px 8px 10px;cursor:pointer;text-align:center;position:relative;font:inherit;color:inherit}
  .tile:active{transform:scale(.97)}
  .tile .pic{aspect-ratio:1/1.1;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:10px;background:#fff}
  .tile img,.tile canvas{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:0}
  .tile b{display:block;margin-top:6px;font-weight:900;font-size:16px}
  .tile .tag{display:inline-block;margin-top:3px;font-size:12px;font-weight:800;color:var(--accent2);text-transform:uppercase;letter-spacing:.8px}
  .tile .star{position:absolute;top:-10px;right:-8px;font-size:22px;display:none}
  .tile.started .star{display:block}
  .ed-head{display:flex;align-items:center;gap:10px;margin:0 auto 12px;max-width:1026px}
  .ed-head h2{margin:0;font-size:24px;font-weight:900;flex:1;text-align:center}
  .ed-head .btn{flex:0 0 auto}
  .ed-head .spacer{width:120px}
  .burst{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:120px;opacity:0;transition:opacity .25s}
  .burst.show{opacity:1}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:8px 16px 20px}
  @media (max-width:640px){ .stage{flex:1 1 100%} .tools{flex:1 1 100%;min-width:0} .swatches{grid-template-columns:repeat(8,1fr)} .gallery{grid-template-columns:repeat(2,1fr)} .ed-head .spacer{display:none} }
</style>
</head>
<body>
<header>
  <h1><span>Matty</span> &amp; <span>Rory</span>: Activity Pack</h1>
  <p class="sub">Brave in My Own Way</p>
</header>
<nav>
  <button data-tab="color" class="on">🖍️ Coloring Pages<span class="badge" id="b-color">⭐</span></button>
  <button data-tab="trace">✏️ Trace Letters<span class="badge" id="b-trace">⭐</span></button>
</nav>
<main>
  <section class="panel on" id="p-color">
    <div id="gallery-view">
      <p class="gal-head">Pick a page to color!</p>
      <div class="gallery" id="gallery"></div>
    </div>
    <div id="editor-view" hidden>
      <div class="ed-head">
        <button class="btn" id="back">← All pages</button>
        <h2 id="ed-title"></h2>
        <span class="spacer"></span>
      </div>
      <div class="work">
        <div class="stage"><canvas id="c-color"></canvas></div>
        <div class="tools">
          <h3>Pick a color</h3>
          <div class="swatches" id="csw"></div>
          <div class="row"><button class="btn on" data-tool="fill">🪣 Tap to fill</button><button class="btn" data-tool="crayon">🖍️ Crayon</button></div>
          <div class="row" id="sizes" hidden><button class="btn sm" data-size="10">Thin</button><button class="btn sm on" data-size="22">Medium</button><button class="btn sm" data-size="40">Fat</button></div>
          <div class="row"><button class="btn" data-act="undo">↩ Undo</button><button class="btn" data-act="erase">Erase page</button></div>
          <div class="row"><button class="btn" data-act="savepic">💾 Save my picture</button></div>
          <div class="msg" id="cmsg"></div>
        </div>
      </div>
    </div>
  </section>
  <section class="panel" id="p-trace">
    <div class="work">
      <div class="stage"><canvas id="c-trace" width="1000" height="560"></canvas></div>
      <div class="tools">
        <h3>Pick a word</h3>
        <div class="row" id="words"></div>
        <h3>Pick a crayon</h3>
        <div class="swatches" id="tsw"></div>
        <div class="row">
          <button class="btn big" id="check">Check my tracing</button>
        </div>
        <div class="row">
          <button class="btn" id="terase">Erase tracing</button>
        </div>
        <div class="msg" id="tmsg">Trace the gray letters with your finger.</div>
      </div>
    </div>
  </section>
</main>
<div class="burst" id="burst">🌟</div>
<footer>Prototype · What Helped Me Through</footer>

<script>
const PAGES = [{"id": "matty", "title": "Meet Matty", "mode": "fill"}, {"id": "rory", "title": "Meet Rory", "mode": "fill"}, {"id": "friends", "title": "Hero Friends", "mode": "fill"}, {"id": "checkup", "title": "Check-up Time", "mode": "fill"}, {"id": "iv-race", "title": "IV Race", "mode": "fill"}, {"id": "room", "title": "Cozy Room", "mode": "fill"}, {"id": "fort", "title": "Blanket Fort", "mode": "fill"}, {"id": "hats", "title": "Pick a Hat", "mode": "fill"}, {"id": "mixups", "title": "The Mix-ups", "mode": "fill"}, {"id": "cleanup", "title": "Cleanup Crew", "mode": "fill"}, {"id": "dream", "title": "Dream Big", "mode": "fill"}, {"id": "award", "title": "Brave Award", "mode": "fill"}, {"id": "cape", "title": "Design a Cape", "mode": "draw"}, {"id": "squad", "title": "My Hero Squad", "mode": "draw"}, {"id": "me", "title": "Draw Yourself", "mode": "draw"}];
const COLORS = [
  "#E53935","#FF6F61","#C2185B","#F48FB1","#FFC1D9","#8E5CC8",
  "#FB8C00","#FFB74D","#FDD835","#FFF59D","#CE93D8","#283593",
  "#2E7D32","#66BB6A","#B9E769","#80CBC4","#00897B","#1E63C6",
  "#4FC3F7","#B3E5FC","#8D5A3B","#9E9E9E","#2D2A32","#FFFFFF",
  "#FCE3D0","#F6D2B8","#E0AC85","#C68642","#8D5524","#5C3A21"
];
const TRACE_COLORS = ["#E53935","#FB8C00","#FDD835","#66BB6A","#2E7D32","#4FC3F7","#1E63C6","#8E5CC8","#F48FB1","#2D2A32"];
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function pos(cv,e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; }
function burst(ch){ const b=document.getElementById('burst'); b.textContent=ch; b.classList.add('show'); setTimeout(()=>b.classList.remove('show'),900); }
function loadImg(src){ return new Promise((ok,bad)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=bad; i.src=src; }); }

/* ---------- Tabs ---------- */
document.querySelectorAll('nav button').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===btn));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+btn.dataset.tab));
  store.set('mr_tab',btn.dataset.tab);
}));

/* ---------- Coloring ---------- */
(function(){
  const gal=document.getElementById('gallery'), galView=document.getElementById('gallery-view'), edView=document.getElementById('editor-view');
  const cv=document.getElementById('c-color'), ctx=cv.getContext('2d'), msg=document.getElementById('cmsg');
  const sw=document.getElementById('csw'), sizes=document.getElementById('sizes');
  let page=null, color=COLORS[0], tool='fill', size=22, undo=[], W=0, H=0, mask=null, colorCv=null, cctx=null, lineImg=null, loadToken=0;

  /* gallery tiles */
  const tiles={};
  PAGES.forEach(p=>{
    const t=document.createElement('button'); t.className='tile'; t.dataset.id=p.id;
    t.innerHTML='<span class="star">⭐</span><div class="pic"><img alt="" src="thumbs/'+p.id+'.png"></div><b>'+p.title+'</b>'+(p.mode==='draw'?'<span class="tag">Draw &amp; color</span>':'');
    t.onclick=()=>openPage(p); gal.appendChild(t); tiles[p.id]=t;
    if(store.get('mr_'+p.id)) markStarted(p.id);
  });
  function markStarted(id){ tiles[id].classList.add('started'); document.getElementById('b-color').classList.add('show'); refreshThumb(id); }
  async function refreshThumb(id){
    const saved=store.get('mr_'+id); const pic=tiles[id].querySelector('.pic');
    if(!saved){ pic.innerHTML='<img alt="" src="thumbs/'+id+'.png">'; return; }
    try{
      const [c,l]=await Promise.all([loadImg(saved),loadImg('thumbs/'+id+'.png')]);
      const t=document.createElement('canvas'); t.width=l.width; t.height=l.height; const x=t.getContext('2d');
      x.drawImage(c,0,0,l.width,l.height); x.globalCompositeOperation='multiply'; x.drawImage(l,0,0);
      pic.innerHTML=''; pic.appendChild(t);
    }catch(e){}
  }

  /* palette */
  COLORS.forEach((c,i)=>{ const b=document.createElement('button'); b.className='sw'+(i===0?' on':''); b.style.background=c; b.setAttribute('aria-label','color '+c);
    b.onclick=()=>pick(c,b); sw.appendChild(b); });
  const mix=document.createElement('label'); mix.className='sw mix'; mix.title='Mix your own color';
  mix.innerHTML='<input type="color" value="#7FDBFF" aria-label="Mix your own color">'; sw.appendChild(mix);
  const mixIn=mix.querySelector('input');
  mixIn.addEventListener('input',()=>{ mix.style.background=mixIn.value; pick(mixIn.value,mix); });
  function pick(c,el){ color=c; sw.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===el)); }

  /* tools */
  document.querySelectorAll('#editor-view [data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
  function setTool(t){ tool=t; document.querySelectorAll('#editor-view [data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool===t)); sizes.hidden=(t!=='crayon');
    msg.className='msg'; msg.textContent= t==='fill' ? 'Tap a space to fill it with color.' : 'Draw with your finger like a crayon.'; }
  sizes.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{ size=+b.dataset.size; sizes.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('on',x===b)); });
  document.querySelector('[data-act="undo"]').onclick=()=>{ if(undo.length&&cctx){ cctx.putImageData(undo.pop(),0,0); render(); save(); } };
  document.querySelector('[data-act="erase"]').onclick=()=>{ if(!cctx) return; clearTimeout(saveT); saveT=null; pushUndo(); cctx.fillStyle='#fff'; cctx.fillRect(0,0,W,H); render(); store.del('mr_'+page.id); tiles[page.id].classList.remove('started'); refreshThumb(page.id); msg.className='msg'; msg.textContent='Fresh page! (Undo brings it back.)'; };
  document.querySelector('[data-act="savepic"]').onclick=()=>{ if(!W) return; const a=document.createElement('a'); a.download='matty-rory-'+page.id+'.png'; a.href=cv.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove(); msg.className='msg good'; msg.textContent='Saved! Look in your Downloads or Files. 🌟'; };
  document.getElementById('back').onclick=()=>{ flushSave(); edView.hidden=true; galView.hidden=false; page=null; store.del('mr_open'); window.scrollTo(0,0); };

  async function openPage(p){
    flushSave();
    page=p; const tok=++loadToken; undo=[]; W=0;
    document.getElementById('ed-title').textContent=p.title;
    galView.hidden=true; edView.hidden=false; store.set('mr_open',p.id);
    requestAnimationFrame(()=>window.scrollTo(0, edView.getBoundingClientRect().top+window.scrollY-8));
    setTool(p.mode==='draw'?'crayon':'fill');
    msg.textContent='Loading…';
    let img; try{ img=await loadImg('pages/'+p.id+'.png'); }catch(e){ msg.textContent='This page did not load. Check your internet and try again.'; return; }
    if(tok!==loadToken) return;
    W=cv.width=img.width; H=cv.height=img.height;
    colorCv=document.createElement('canvas'); colorCv.width=W; colorCv.height=H; cctx=colorCv.getContext('2d');
    cctx.fillStyle='#fff'; cctx.fillRect(0,0,W,H);
    const t=document.createElement('canvas'); t.width=W; t.height=H; const tc=t.getContext('2d'); tc.drawImage(img,0,0);
    const d=tc.getImageData(0,0,W,H).data; mask=new Uint8Array(W*H);
    for(let i=0;i<W*H;i++) mask[i]= d[i*4]<200 ? 1:0;
    lineImg=img;
    const saved=store.get('mr_'+p.id);
    if(saved){ try{ const s=await loadImg(saved); if(tok!==loadToken) return; cctx.drawImage(s,0,0); }catch(e){} }
    render(); setTool(tool);
  }

  function render(){ ctx.globalCompositeOperation='source-over'; ctx.drawImage(colorCv,0,0); ctx.globalCompositeOperation='multiply'; ctx.drawImage(lineImg,0,0); ctx.globalCompositeOperation='source-over'; }
  function pushUndo(){ undo.push(cctx.getImageData(0,0,W,H)); if(undo.length>15) undo.shift(); }
  let saveT=null, savePage=null;
  function save(){ clearTimeout(saveT); savePage=page; saveT=setTimeout(flushSave,400); }
  function flushSave(){ if(!saveT) return; clearTimeout(saveT); saveT=null; const p=savePage; if(!p||!colorCv) return;
    if(store.set('mr_'+p.id,colorCv.toDataURL('image/png'))) markStarted(p.id);
    else { msg.className='msg'; msg.textContent='This device is out of room to save pages. Try erasing a page you are done with.'; } }

  function fill(x,y){
    x=Math.floor(x); y=Math.floor(y); if(x<0||y<0||x>=W||y>=H) return;
    if(mask[y*W+x]){ let found=false; for(let r=1;r<=8&&!found;r++) for(let dy=-r;dy<=r&&!found;dy++) for(let dx=-r;dx<=r&&!found;dx++){ const nx=x+dx,ny=y+dy; if(nx>=0&&ny>=0&&nx<W&&ny<H&&!mask[ny*W+nx]){x=nx;y=ny;found=true;} } if(!found) return; }
    const id=cctx.getImageData(0,0,W,H), px=id.data;
    const r=parseInt(color.slice(1,3),16), g=parseInt(color.slice(3,5),16), b=parseInt(color.slice(5,7),16);
    const si=(y*W+x)*4, tr=px[si], tg=px[si+1], tb=px[si+2];
    if(Math.abs(tr-r)<4&&Math.abs(tg-g)<4&&Math.abs(tb-b)<4) return;
    pushUndo();
    const tol=48, seen=new Uint8Array(W*H);
    const match=i=>!mask[i]&&!seen[i]&&Math.abs(px[i*4]-tr)<=tol&&Math.abs(px[i*4+1]-tg)<=tol&&Math.abs(px[i*4+2]-tb)<=tol;
    const stack=[[x,y]];
    while(stack.length){
      let [sx,sy]=stack.pop(); let i=sy*W+sx;
      while(sx>0&&match(i-1)){sx--;i--;}
      let up=false,down=false;
      while(sx<W&&match(i)){
        seen[i]=1; px[i*4]=r; px[i*4+1]=g; px[i*4+2]=b; px[i*4+3]=255;
        if(sy>0){ const u=i-W; if(match(u)){ if(!up){stack.push([sx,sy-1]);up=true;} } else up=false; }
        if(sy<H-1){ const dn=i+W; if(match(dn)){ if(!down){stack.push([sx,sy+1]);down=true;} } else down=false; }
        sx++; i++;
      }
    }
    cctx.putImageData(id,0,0); render(); save();
  }

  let drawing=false, last=null;
  cv.addEventListener('pointerdown',e=>{ if(!W) return; e.preventDefault(); const p=pos(cv,e);
    if(tool==='fill'){ fill(p.x,p.y); return; }
    try{ cv.setPointerCapture(e.pointerId); }catch(_){} pushUndo(); drawing=true; last=p; stroke(p); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; stroke(pos(cv,e)); });
  const end=()=>{ if(drawing){ drawing=false; save(); } };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  function stroke(p){ cctx.strokeStyle=color; cctx.lineWidth=size; cctx.lineCap='round'; cctx.lineJoin='round'; cctx.beginPath(); cctx.moveTo(last.x,last.y); cctx.lineTo(p.x+0.01,p.y); cctx.stroke(); last=p; render(); }
  window.addEventListener('pagehide',flushSave);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushSave(); });

  const openId=store.get('mr_open'); const op=PAGES.find(p=>p.id===openId); if(op) openPage(op);
  window.__color={openPage,PAGES,state:()=>({page:page&&page.id,tool,size,color,W,H,undo:undo.length})};
})();

/* ---------- Tracing ---------- */
(function(){
  const WORDS=["MATTY","RORY","BRAVE"];
  const cv=document.getElementById('c-trace'), ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  const msg=document.getElementById('tmsg');
  let word=0, color=TRACE_COLORS[6], strokes=[], cur=null, boxes=[], fontPx=0, done={};
  try{ done=JSON.parse(store.get('mr_trace_done')||'{}'); }catch(e){ done={}; }
  const mk=()=>{ const c=document.createElement('canvas'); c.width=W; c.height=H; return c; };
  const glyph=mk(), zone=mk(), ink=mk();
  const wordsEl=document.getElementById('words');
  WORDS.forEach((w,i)=>{ const b=document.createElement('button'); b.className='btn'+(i===0?' on':''); b.textContent=(done[w]?'⭐ ':'')+w;
    b.onclick=()=>{ word=i; wordsEl.querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x===b)); strokes=[]; layout(); draw(); msg.className='msg'; msg.textContent='Trace the gray letters with your finger.'; }; wordsEl.appendChild(b); });
  const tsw=document.getElementById('tsw');
  TRACE_COLORS.forEach((c,i)=>{ const b=document.createElement('button'); b.className='sw'+(i===6?' on':''); b.style.background=c;
    b.onclick=()=>{ color=c; tsw.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b)); }; tsw.appendChild(b); });
  if(Object.keys(done).length) document.getElementById('b-trace').classList.add('show');

  function layout(){
    const w=WORDS[word]; const g=glyph.getContext('2d');
    fontPx=300; g.font='900 '+fontPx+'px Nunito'; const gap=fontPx*0.08;
    let total=[...w].reduce((s,ch)=>s+g.measureText(ch).width,0)+gap*(w.length-1);
    const scale=Math.min(1,(W*0.9)/total); fontPx=Math.floor(fontPx*scale); g.font='900 '+fontPx+'px Nunito';
    total=[...w].reduce((s,ch)=>s+g.measureText(ch).width,0)+gap*scale*(w.length-1);
    let x=(W-total)/2; const base=H/2+fontPx*0.36; boxes=[];
    for(const ch of w){ const cw=g.measureText(ch).width; boxes.push({ch,x,w:cw,base}); x+=cw+gap*scale; }
    [glyph,zone].forEach((c,k)=>{ const cc=c.getContext('2d'); cc.clearRect(0,0,W,H); cc.font='900 '+fontPx+'px Nunito'; cc.fillStyle='#000'; cc.strokeStyle='#000'; cc.lineJoin='round'; cc.lineWidth=36;
      boxes.forEach(b=>{ cc.fillText(b.ch,b.x,b.base); if(k===1) cc.strokeText(b.ch,b.x,b.base); }); });
  }
  function draw(){
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    const top=H/2-fontPx*0.36, base=H/2+fontPx*0.36;
    ctx.strokeStyle='#D7E6EE'; ctx.lineWidth=3; ctx.setLineDash([]);
    [top,base].forEach(y=>{ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(W-30,y);ctx.stroke();});
    ctx.setLineDash([12,10]); ctx.beginPath(); ctx.moveTo(30,H/2); ctx.lineTo(W-30,H/2); ctx.stroke();
    ctx.font='900 '+fontPx+'px Nunito'; ctx.fillStyle='#EDEAE4'; ctx.strokeStyle='#B9B2A8'; ctx.lineWidth=4; ctx.setLineDash([14,12]);
    boxes.forEach(b=>{ ctx.fillText(b.ch,b.x,b.base); ctx.strokeText(b.ch,b.x,b.base); });
    ctx.setLineDash([]);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=16;
    strokes.forEach(s=>{ ctx.strokeStyle=s.c; ctx.beginPath(); s.p.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y+0.01)); if(s.p.length===1) ctx.lineTo(s.p[0].x+0.1,s.p[0].y); ctx.stroke(); });
  }
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} cur={c:color,p:[pos(cv,e)]}; strokes.push(cur); draw(); });
  cv.addEventListener('pointermove',e=>{ if(!cur) return; cur.p.push(pos(cv,e)); draw(); });
  const end=()=>{ cur=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  document.getElementById('terase').onclick=()=>{ strokes=[]; draw(); msg.className='msg'; msg.textContent='Fresh page! Trace the gray letters.'; };

  document.getElementById('check').onclick=()=>{
    if(!strokes.length){ msg.className='msg'; msg.textContent='Trace the letters first, then tap Check.'; return; }
    const ic=ink.getContext('2d'); ic.clearRect(0,0,W,H); ic.strokeStyle='#000'; ic.lineWidth=40; ic.lineCap='round'; ic.lineJoin='round';
    strokes.forEach(s=>{ ic.beginPath(); s.p.forEach((p,i)=>i?ic.lineTo(p.x,p.y):ic.moveTo(p.x,p.y)); if(s.p.length===1) ic.lineTo(s.p[0].x+0.1,s.p[0].y); ic.stroke(); });
    const gd=glyph.getContext('2d').getImageData(0,0,W,H).data, id=ic.getImageData(0,0,W,H).data, zd=zone.getContext('2d').getImageData(0,0,W,H).data;
    const weak=[];
    boxes.forEach(b=>{ let tot=0,cov=0; for(let y=0;y<H;y+=4) for(let x=Math.floor(b.x);x<b.x+b.w;x+=4){ const i=(y*W+x)*4+3; if(gd[i]>128){ tot++; if(id[i]>128) cov++; } } b.cov=tot?cov/tot:1; if(b.cov<0.6) weak.push(b.ch); });
    let pts=0,off=0; strokes.forEach(s=>s.p.forEach(p=>{ const x=Math.round(p.x),y=Math.round(p.y); if(x<0||y<0||x>=W||y>=H) return; pts++; if(zd[(y*W+x)*4+3]<128) off++; }));
    const offFrac=pts?off/pts:0;
    if(weak.length){ msg.className='msg'; msg.textContent= weak.length===boxes.length ? 'Good start! Keep tracing all the letters.' : 'Almost! Try the letter '+weak[0]+' again. 💪'; return; }
    if(offFrac>0.3){ msg.className='msg'; msg.textContent='Nice! Try to stay inside the gray letters.'; return; }
    const w=WORDS[word]; done[w]=1; store.set('mr_trace_done',JSON.stringify(done));
    wordsEl.children[word].textContent='⭐ '+w; document.getElementById('b-trace').classList.add('show');
    msg.className='msg good'; msg.textContent='Amazing tracing, hero! You wrote '+w+'! 🌟'; burst('🌟');
  };

  const start=()=>{ layout(); draw(); };
  if(document.fonts&&document.fonts.load){ document.fonts.load('900 100px Nunito').then(start,start); } else start();
})();

/* restore last tab */
(function(){ const t=store.get('mr_tab'); const b=document.querySelector('nav button[data-tab="'+(t==='trace'?'trace':'color')+'"]'); if(b) b.click(); })();
</script>
</body>
